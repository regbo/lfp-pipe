name: Tagged release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Find missing release targets
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        name: Build target matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          assets='[]'
          if [ "${{ github.event_name }}" = "release" ]; then
            assets="$(gh release view "$RELEASE_TAG" --json assets --jq '[.assets[].name]')"
          fi
          candidates='[
            {"runner":"ubuntu-24.04","target":"x86_64-unknown-linux-gnu","archive":"tar.gz","asset":"lfp-pipe-'"$RELEASE_TAG"'-x86_64-unknown-linux-gnu.tar.gz"},
            {"runner":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","archive":"tar.gz","asset":"lfp-pipe-'"$RELEASE_TAG"'-aarch64-unknown-linux-gnu.tar.gz"},
            {"runner":"windows-2025","target":"x86_64-pc-windows-msvc","archive":"zip","asset":"lfp-pipe-'"$RELEASE_TAG"'-x86_64-pc-windows-msvc.zip"},
            {"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","archive":"zip","asset":"lfp-pipe-'"$RELEASE_TAG"'-aarch64-pc-windows-msvc.zip"},
            {"runner":"macos-15-intel","target":"x86_64-apple-darwin","archive":"tar.gz","asset":"lfp-pipe-'"$RELEASE_TAG"'-x86_64-apple-darwin.tar.gz"},
            {"runner":"macos-15","target":"aarch64-apple-darwin","archive":"tar.gz","asset":"lfp-pipe-'"$RELEASE_TAG"'-aarch64-apple-darwin.tar.gz"}
          ]'
          matrix="$(jq -c --argjson assets "$assets" '[.[] | select(.asset as $asset | $assets | index($asset) | not)] | {include: .}' <<<"$candidates")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${{ matrix.target }}"
          rustup default stable

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - name: Test workspace
        run: cargo test --workspace --release --locked --target ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --workspace --release --locked --target ${{ matrix.target }}

      - name: Package Unix binaries
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -eu
          archive="lfp-pipe-${RELEASE_TAG}-${{ matrix.target }}"
          mkdir -p "dist/${archive}/bin"
          cp "target/${{ matrix.target }}/release/lfp-pipe-server" "dist/${archive}/bin/"
          cp "target/${{ matrix.target }}/release/lfp-pipe-client" "dist/${archive}/bin/"
          tar -C dist -czf "dist/${archive}.tar.gz" "${archive}"
          rm -rf "dist/${archive}"

      - name: Package Windows binaries
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          $archive = "lfp-pipe-$env:RELEASE_TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$archive/bin" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/lfp-pipe-server.exe" "dist/$archive/bin/"
          Copy-Item "target/${{ matrix.target }}/release/lfp-pipe-client.exe" "dist/$archive/bin/"
          Compress-Archive -Path "dist/$archive" -DestinationPath "dist/$archive.zip"
          Remove-Item -Recurse -Force "dist/$archive"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  finalize:
    name: Publish checksums and missing assets
    if: github.event_name == 'release'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Actions-built archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: actions-release
          merge-multiple: true

      - name: Generate complete checksums and upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          gh release download "$RELEASE_TAG" --pattern 'lfp-pipe-*' --dir release
          cp actions-release/* release/
          (cd release && sha256sum lfp-pipe-* > SHA256SUMS)
          gh release upload "$RELEASE_TAG" actions-release/* release/SHA256SUMS --clobber
