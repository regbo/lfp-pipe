[package]
name = "client"
version = "0.1.14"
edition = "2024"
autobins = false

[features]
default = ["desktop"]
desktop = [
    "dep:auto-launcher",
    "dep:open",
    "dep:tiny-skia",
    "dep:tinyfiledialogs",
    "dep:tray-icon",
    "dep:winit",
]

[lib]
name = "client"

[[bin]]
name = "lfp-pipe-client"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
atomic-write-file.workspace = true
async-nats.workspace = true
base64.workspace = true
bytes.workspace = true
cookie.workspace = true
constant_time_eq.workspace = true
futures.workspace = true
http-body-util.workspace = true
httparse.workspace = true
hyper.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
notify.workspace = true
openidconnect.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-acme.workspace = true
serde.workspace = true
serde_json.workspace = true
shared = { path = "../shared" }
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
auto-launcher = { workspace = true, optional = true }
dirs.workspace = true
tinyfiledialogs = { workspace = true, optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
open = { workspace = true, optional = true }
tray-icon = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
